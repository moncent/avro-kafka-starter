# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  workflow_dispatch:
    inputs:
      without_test:
        type: boolean
        default: false
        description: skip junit tests
      start_tc:
        type: boolean
        default: false
        description: start test container
      stop_tc:
        type: boolean
        default: false
        description: try stop test container

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Setup Testcontainers Cloud Client
      if: inputs.start_tc == 'true'
      uses: atomicjar/testcontainers-cloud-setup-action@v1
      with:
        token: ${{ secrets.TC_CLOUD_TOKEN }}

    - name: Build with Maven
      run: mvn clean package -DskipTests=${{ inputs.without_test }} --file pom.xml

    - name: Terminate Testcontainers Cloud Client active sessions
      if: inputs.stop_tc == 'true'
      uses: atomicjar/testcontainers-cloud-setup-action@v1
      with:
        action: terminate
