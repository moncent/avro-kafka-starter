# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  workflow_dispatch:
    inputs:
      without_test:
        type: boolean
        default: false
        description: skip junit tests
      with_allure:
        type: boolean
        default: false
        description: with allure report
      start_tc:
        type: boolean
        default: false
        description: start test container
      stop_tc:
        type: boolean
        default: false
        description: try stop test container

permissions:
  id-token: write
  pages: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Setup Testcontainers Cloud Client
      if: inputs.start_tc == 'true'
      uses: atomicjar/testcontainers-cloud-setup-action@v1
      with:
        token: ${{ secrets.TC_CLOUD_TOKEN }}

    - name: Build with Maven
      run: mvn clean package -DskipTests=${{ inputs.without_test }} --file pom.xml

    - name: Store allure results
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path:
          allure-results
        retention-days: 1

    - name: Terminate Testcontainers Cloud Client active sessions
      if: inputs.stop_tc == 'true'
      uses: atomicjar/testcontainers-cloud-setup-action@v1
      with:
        action: terminate

  generate-report:
    runs-on: ubuntu-latest
    needs: build
    name: Generate report
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: sudo wget https://github.com/allure-framework/allure2/releases/download/2.34.0/allure-2.34.0.tgz && sudo tar -zxvf allure-2.34.0.tgz -C /opt/ && sudo ln -s /opt/allure-2.34.0/bin/allure /usr/bin/allure
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
      - run: allure generate -c allure-results -o _site
      - name: Store generated report
        uses: actions/upload-artifact@v4
        with:
          name: _site
          path:
            _site
          retention-days: 1

  publish-report:
    runs-on: ubuntu-latest
    needs: generate-report
    name: Report publication
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
