choiceOneHelp=Генерируется json файл со случайными значениями на основе схемы avro (формат .avsc).\n\
Она должна находиться в одной директории с этой программой. Здесь же будет находиться сгенерированный json.

avroSchemaHasBeenGeneratedSuccess=Файл %s успешно сгенерирован.%n

choiceTwoHelp=Сперва необходимо прописать значения в файле config.yml (находится в директории программы), указав\r\n\
настройки подключения к топику кафки. После этого можно выполнять действие.\r\n\
\r\n\
Примеры заполнения:\r\n\
- без сертификатов\r\n\
\r\n\
kafka:\r\n\
\t   producer:\n\
\t\t      bootstrapServers: localhost1:9092,localhost2:9092\r\n\
\t\t      topic: test_topic\r\n\
\t\t      key: test_key\r\n\
\t\t      headers:\r\n\
\t\t\t        - header1: value1\r\n\
\t\t\t        - header2: value2\r\n\
\t\t      ssl:\r\n\
\t\t\t        enabled: false\r\n\
\t\t\t        protocol:\r\n\
\t\t\t        keystore:\r\n\
\t\t\t\t            location:\r\n\
\t\t\t\t            password:\r\n\
\t\t\t        truststore:\r\n\
\t\t\t\t            location:\r\n\
\t\t\t\t            password:\r\n\
\r\n\
- с сертификатами\r\n\
\r\n\
kafka:\r\n\
\t  producer:\r\n\
\t\t        bootstrapServers: localhost1:9093,localhost2:9093\r\n\
\t\t        topic: test_topic\r\n\
\t\t        key: test_key\r\n\
\t\t        headers:\r\n\
\t\t\t          - header1: value1\r\n\
\t\t\t          - header2: value2\r\n\
\t\t        ssl:\n\
\t\t\t            enabled: true\r\n\
\t\t\t            protocol: TLSv1.2\r\n\
\t\t\t            keystore:\r\n\
\t\t\t\t                location: C:\\keystore.jks\r\n\
\t\t\t\t                password: 123\r\n\
\t\t\t            truststore:\r\n\
\t\t\t\t                location: C:\\keystore.jks\r\n\
\t\t\t\t                password: 123

