menu=Выберите действие:\n\
1 - Сгенерировать json файл из avro схемы\n\
2 - Отправить сообщение в кафку\n\
3 - Создать бинарный avro файл из json файла *\n\
4 - Отправить бинарный avro файл в кафку *\n\
5 - Выход\n\
? - Справка

