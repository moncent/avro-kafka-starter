choiceHelp=Программа предназначена для отправки своих сообщений в бинарном формате avro в топик кафки.\n\
Необходимо, чтобы в директории с программой присутствовала avro схема (формат .avsc).\n\
\n\
Действия 1 и 2 - стандартные, выполняются по порядку. Чтобы выполнить следующее действие,\n\
рекомендуется дождаться информационного сообщения о завершении текущего.\n\
\n\
Звёздочкой * в перечне обозначены манипуляции, которые уже объединены в действии 2, но\n\
по каким-то причинам нужно выполнить какое-то одно из них в отдельности.\n\
\n\
Если раньше не работали с этой программой, рекомендуется ознакомиться с дополнительной\n\
информацией по каждой команде, добавив к действию вопросительный знак: <действие>?

