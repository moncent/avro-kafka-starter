menu=Select action:\n\
1 - Generate json file from avro schema\n\
2 - Send message to kafka\n\
3 - Generate binary avro file from json file *\n\
4 - Send binary avro file to Kafka *\n\
5 - Exit\n\
? - Help
unknownCommand=Unknown command
errorMain=Error! The program is shutting down.
errorMainMore=More info about the error:

choiceOneHelp=A json file with random values is generated based on the avro schema (.avsc format).\n\
It must be located in the same directory with this program. The generated json will also be located here.

avroSchemaHasBeenGeneratedSuccess=File %s was generated successfully.%n

choiceTwoHelp=First of all, it is necessary to write values in the config.yml file (located in the program directory), specifying\r\n\
the connection settings to the Kafka topic. After that, you can perform the action\r\n\
Examples:\r\n\
- w/o certs\r\n\
\r\n\
kafka:\r\n\
\t   producer:\n\
\t\t      bootstrapServers: localhost1:9092,localhost2:9092\r\n\
\t\t      topic: test_topic\r\n\
\t\t      key: test_key\r\n\
\t\t      headers:\r\n\
\t\t\t        - header1: value1\r\n\
\t\t\t        - header2: value2\r\n\
\t\t      ssl:\r\n\
\t\t\t        enabled: false\r\n\
\t\t\t        protocol:\r\n\
\t\t\t        keystore:\r\n\
\t\t\t\t            location:\r\n\
\t\t\t\t            password:\r\n\
\t\t\t        truststore:\r\n\
\t\t\t\t            location:\r\n\
\t\t\t\t            password:\r\n\
\r\n\
- with certs\r\n\
\r\n\
kafka:\r\n\
\t  producer:\r\n\
\t\t        bootstrapServers: localhost1:9093,localhost2:9093\r\n\
\t\t        topic: test_topic\r\n\
\t\t        key: test_key\r\n\
\t\t        headers:\r\n\
\t\t\t          - header1: value1\r\n\
\t\t\t          - header2: value2\r\n\
\t\t        ssl:\n\
\t\t\t            enabled: true\r\n\
\t\t\t            protocol: TLSv1.2\r\n\
\t\t\t            keystore:\r\n\
\t\t\t\t                location: C:\\keystore.jks\r\n\
\t\t\t\t                password: 123\r\n\
\t\t\t            truststore:\r\n\
\t\t\t\t                location: C:\\keystore.jks\r\n\
\t\t\t\t                password: 123

