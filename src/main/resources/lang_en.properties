choiceHelp=The program is developed for sending your messages in binary avro format to kafka topics. It is necessary\n\
to have an avro schema (.avsc format) in the directory with the program.\n\
\n\
Actions 1 and 2 are standard and are performed in order. To perform the next step, it is recommended that you\n\
wait for the information message that the current action is complete.\n\
\n\
An asterisk * in the list indicates manipulations that are already combined in step 2, but for some reason you need\n\
to do one of them separately.\n\
\n\
If you have not worked with this program before, it is recommended that you read the additional information for each command\n\
by adding a question mark to the action: <action>?

